services:
  - type: web
    name: smart-watchlist
    env: node
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-watchlist-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: smart-watchlist-db
    databaseName: smart_watchlist
    plan: free
